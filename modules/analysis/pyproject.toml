[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-analysis"
version = "0.1.0"
description = "Utilities for parsing and analyzing broker order exports."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Trading Systems" }]
dependencies = [
  "plotly>=5.24",
  "asciichart>=0.1",
  "streamlit>=1.32",
]

[project.scripts]
trading-parse-orders = "trading_analysis.parse_orders:main"
trading-schwab-convert = "trading_analysis.schwab.convert:main"
trading-bucket-analysis = "trading_analysis.bucket_analysis:main"
trading-webull-bridge = "trading_analysis.webull_bridge:main"
trading-tpo-grade = "trading_analysis.export_tpo_grades:main"
trading-trade-hold-review = "trading_analysis.export_trade_hold_review:main"
trading-rescan-market-data = "trading_analysis.rescan_market_data:main"
trading-fisher-trade-overlay = "trading_analysis.fisher_trade_overlay:main"
trading-compliance-monitor = "trading_analysis.compliance_monitor:main"
trading-options-premium = "trading_analysis.options_premium.cli:main"
trading-options-premium-ui = "trading_analysis.options_premium.ui:main"
trading-levered-trend-following = "trading_analysis.strategies.levered_weekly_trend:main"
trading-composite-trend = "trading_analysis.strategies.composite_trend:main"
trading-scanner-weekly-batch = "trading_analysis.strategies.scanner_batch:main"
trading-strategy-chart-hub = "trading_analysis.strategies.chart_hub:main"
trading-weekly-control-experiment = "trading_analysis.strategies.weekly_control_experiment:main"
trading-evaluate-trade = "trading_analysis.evaluate_trade:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/trading_analysis"]
